[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octopos-core"
version = "0.1.0"
description = "OctopOS Core Runtime — Agent Orchestrator"
requires-python = ">=3.11"

[project.dependencies]
fastapi = ">=0.111"
uvicorn = {extras = ["standard"], version = ">=0.29"}
pydantic = ">=2.0"
litellm = ">=1.40"
matrix-nio = ">=0.24"
watchdog = ">=4.0"
pyyaml = ">=6.0"
redis = ">=5.0"
anthropic = ">=0.40"
httpx = ">=0.27"

[tool.hatch.build.targets.wheel]
packages = ["src/octopos_core"]
