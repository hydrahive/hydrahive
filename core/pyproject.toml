[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydrahive-core"
version = "0.1.0"
description = "HydraHive Core Runtime — Agent Orchestrator"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.111",
    "uvicorn[standard]~=0.29",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "litellm~=1.82",
    "matrix-nio~=0.25",
    "watchdog~=4.0",
    "pyyaml~=6.0",
    "anthropic~=0.40",
    "slowapi~=0.1.9",
    "python-jose[cryptography]~=3.5",
    "httpx~=0.27",
    "croniter~=2.0",
    "discord.py~=2.4",
    "python-telegram-bot~=21.0",
    "redis~=5.0",
    "websockets~=12.0",
    "mcp>=1.0.0",
    "psutil~=5.9",
    "faiss-cpu~=1.8",
    "numpy~=1.26",
    "playwright~=1.40",
    "edge-tts>=7.0",
    "paramiko~=4.0",
    # #554: Collaborative Composer via Yjs/CRDT.
    # pycrdt = Python bindings zum Rust yrs-crate (Nachfolger von y-py, das seit
    # April 2025 archiviert ist). pycrdt-websocket liefert den ASGI-Adapter + eine
    # SQLite-Persistence, die sich an FastAPI mounten lässt.
    "pycrdt~=0.12",
    "pycrdt-websocket~=0.16",
    # #749: Bounded + thread-safe TTL-Cache für den permission_classifier.
    "cachetools~=5.5",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "pytest-asyncio~=0.23",
    "pytest-cov~=5.0",
    "httpx~=0.27",
    "aiohttp~=3.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/hydrahive_core"]
omit = ["*/tests/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/hydrahive_core"]
