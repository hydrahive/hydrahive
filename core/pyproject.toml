[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydrahive-core"
version = "0.1.0"
description = "HydraHive Core Runtime — Agent Orchestrator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "litellm>=1.40",
    "matrix-nio>=0.24",
    "watchdog>=4.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "slowapi>=0.1.9",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "croniter>=2.0",
    "discord.py>=2.3",
    "redis>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hydrahive_core"]
