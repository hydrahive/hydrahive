id: minecraft-server
name: Minecraft Server
version: 1.0.0
description: Minecraft-Server überwachen und via RCON steuern — Status, Spieler, Whitelist, Befehle.
author: HydraHive
type: tool
runtime: python
permissions: []
auto_attach: false
config_fields:
  - key: host
    label: Server Host
    type: string
  - key: port
    label: Server Port (default: 25565)
    type: number
  - key: rcon_port
    label: RCON Port (default: 25575)
    type: number
  - key: rcon_password
    label: RCON Password
    type: password
