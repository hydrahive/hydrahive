id: valheim-server
name: Valheim Server
version: 1.0.0
description: Valheim Dedicated Server überwachen und verwalten — Status, Spieler, Backup, Neustart.
author: HydraHive
type: tool
runtime: python
permissions:
  - system.exec
auto_attach: false
config_fields:
  - key: host
    label: Server Host
    type: string
  - key: port
    label: "Query Port (default: 2457)"
    type: number
  - key: server_name
    label: "Server Name (für Prozess-Suche)"
    type: string
  - key: save_dir
    label: "Save Directory"
    type: string
  - key: backup_dir
    label: Backup Directory
    type: string
  - key: service_name
    label: "Systemd Service Name (z.B. valheim)"
    type: string
