<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="3">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HydraHive · Update läuft</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f1117; color: #e5e7eb; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .box { text-align: center; max-width: 360px; padding: 2rem; }
    .icon { font-size: 3rem; margin-bottom: 1rem; animation: spin 2s linear infinite; display: inline-block; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.5rem; }
    p { color: #9ca3af; font-size: 0.875rem; margin: 0; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; margin: 1.5rem 0.2rem 0; animation: pulse 1s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%,100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">⚙️</div>
    <h1>HydraHive wird aktualisiert</h1>
    <p>Der Core startet neu — die Seite lädt automatisch neu.</p>
    <div>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
