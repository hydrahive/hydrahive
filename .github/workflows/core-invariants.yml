name: Core Invariants

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-invariants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-invariants:
    name: core-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml

      - name: Install core test dependencies
        working-directory: core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run architecture + composer + security/isolation/tool tests
        working-directory: core
        run: |
          python -m pytest \
            tests/test_architecture_invariants.py \
            tests/test_composer.py \
            tests/test_composer_admin.py \
            tests/test_composer_project.py \
            tests/test_prompt_cache_namespace.py \
            tests/test_composer_etag.py \
            tests/test_browser_ssrf.py \
            tests/test_browser_evaluate_guard.py \
            tests/test_permission_classifier_cache.py \
            tests/test_rate_limiter.py \
            tests/test_auth_cookie.py \
            tests/test_unrestricted_root_block.py \
            tests/test_security.py \
            tests/test_security_regressions.py \
            tests/test_tool_guard.py \
            tests/test_shell_sandbox.py \
            tests/test_isolation_enforcement.py \
            tests/test_subagent_isolation.py \
            tests/test_subagent_write_scope.py \
            tests/test_review_guards.py \
            tests/test_access_control.py \
            --cov=hydrahive_core \
            --cov-report=xml \
            --cov-report=term \
            -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: core/coverage.xml
          retention-days: 30
          if-no-files-found: warn

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        working-directory: console
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: console
        run: npx tsc --noEmit

      - name: Build (vite)
        working-directory: console
        run: npm run build

      - name: Verify CSP inline-script hash (#751)
        run: python3 scripts/verify_csp_hash.py
