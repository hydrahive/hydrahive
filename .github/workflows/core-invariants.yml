name: Core Invariants

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-invariants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-invariants:
    name: core-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml

      - name: Install core test dependencies
        working-directory: core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run architecture + composer + security/isolation/tool tests
        working-directory: core
        run: |
          python -m pytest \
            tests/test_architecture_invariants.py \
            tests/test_composer.py \
            tests/test_composer_admin.py \
            tests/test_composer_project.py \
            tests/test_prompt_cache_namespace.py \
            tests/test_composer_etag.py \
            tests/test_browser_ssrf.py \
            tests/test_unrestricted_root_block.py \
            tests/test_security.py \
            tests/test_security_regressions.py \
            tests/test_tool_guard.py \
            tests/test_shell_sandbox.py \
            tests/test_isolation_enforcement.py \
            tests/test_subagent_isolation.py \
            tests/test_subagent_write_scope.py \
            tests/test_review_guards.py \
            tests/test_access_control.py \
            -q
