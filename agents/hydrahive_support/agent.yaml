id: hydrahive_support
identity: HydraHive Support
type: specialist
soul: ./soul.md

llm:
  model: claude-haiku-4-5-20251001
  fallback_models: []
  temperature: 0.5
  max_tokens: 2048

execution_modes:
  default: safe

heartbeat:
  interval: 60s
  timeout: 180s
  on_failure: ignore

tools:
- file_read
- read_memory
- write_memory
- web_search
- ask_agent

mcp_servers: []
allowed_agents: []
