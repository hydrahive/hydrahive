id: hydrahive_sysinfo
identity: HydraHive System-Experte
type: specialist
soul: ./soul.md

llm:
  model: claude-sonnet-4-6
  fallback_models:
  - claude-haiku-4-5-20251001
  temperature: 0.1
  max_tokens: 4096

execution_modes:
  default: safe
  safe:
    permissions:
    - filesystem.read
    - system.read
    - memory.read
    - memory.write

heartbeat:
  interval: 60s
  timeout: 180s
  on_failure: ignore

tools:
- shell_exec
- read_memory
- write_memory

mcp_servers: []
allowed_agents: []
