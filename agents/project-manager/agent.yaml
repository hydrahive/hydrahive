id: project-manager
identity: Project Manager
type: boss
soul: ./soul.md

llm:
  model: claude-sonnet-4-6
  fallback_models:
  - claude-haiku-4-5-20251001
  temperature: 0.4
  max_tokens: 4096

execution_modes:
  default: safe
  safe:
    permissions:
    - filesystem.read
    - memory.read
    - memory.write
    - agents.ask
    - agents.delegate

heartbeat:
  interval: 60s
  timeout: 300s
  on_failure: restart

tools:
# Dateien (lesen)
- file_read
- list_directory
# Web
- web_search
- http_request
# Git & Issues
- git_status
- gitea_repo_inspect
- gitea_repo_commits
- gitea_create_issue
- gitea_comment_issue
- gitea_update_issue
# Memory
- read_memory
- write_memory
# Agenten-Koordination
- ask_agent
- delegate_agent
- dispatch_task
- spawn_agent
# Handoff
- write_handoff
- read_handoff

mcp_servers: []
allowed_agents:
- dev-assistant
- code-reviewer
