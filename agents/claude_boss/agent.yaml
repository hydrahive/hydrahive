id: claude_boss
identity: Projekt-Boss
type: boss
soul: ./soul.md

llm:
  model: claude-sonnet-4-6
  fallback_models:
  - claude-haiku-4-5-20251001
  temperature: 0.4
  max_tokens: 8192

execution_modes:
  default: safe
  safe:
    permissions:
    - filesystem.read
    - filesystem.write
    - system.exec
    - memory.read
    - memory.write
    - agents.ask
    - agents.dispatch
    - git.read
    - git.write

heartbeat:
  interval: 60s
  timeout: 300s
  on_failure: restart

tools:
- file_read
- file_write
- list_directory
- project_shell
- read_memory
- write_memory
- web_search
- ask_agent
- dispatch_task
- git_status
- git_diff
- git_commit
- git_push
- create_skill
- list_skills
- delete_skill

mcp_servers: []
allowed_agents: []
