id: haiku
identity: Haiku Documentation Writer
type: specialist
soul: ./soul.md

llm:
  model: claude-haiku-4-5-20251001
  fallback_models:
  - claude-sonnet-4-6
  temperature: 0.3
  max_tokens: 8192

execution_modes:
  default: safe
  safe:
    permissions:
    - filesystem.read
    - filesystem.write
    - memory.read
    - memory.write

heartbeat:
  interval: 60s
  timeout: 300s
  on_failure: restart

tools:
# Dateien (lesen + schreiben)
- file_read
- file_write
- file_search
- list_directory
# Web
- web_search
- http_request
# Git (nur lesen)
- git_status
- git_diff
- gitea_repo_inspect
- gitea_repo_tree
- gitea_repo_file
- gitea_repo_commits
# Memory
- read_memory
- write_memory
# Agenten
- ask_agent
