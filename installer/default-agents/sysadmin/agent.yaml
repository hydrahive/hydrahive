id: sysadmin
identity: System-Administrator
type: specialist
default: true
soul: ./soul.md

llm:
  model: claude-sonnet-4-6
  temperature: 0.3
  max_tokens: 4096

execution_modes:
  default: elevated
  safe:
    permissions:
    - filesystem.read
    - system.read
    - memory.read
    - memory.write
  elevated:
    permissions:
    - filesystem.read
    - filesystem.write
    - shell.exec
    - system.read
    - system.write
    - memory.read
    - memory.write

heartbeat:
  interval: 60s
  timeout: 180s
  on_failure: ignore

tools:
- shell_exec
- read_file
- write_file
- read_system_file
- write_system_file
- http_request
- read_memory
- write_memory

mcp_servers: []
allowed_agents: []
