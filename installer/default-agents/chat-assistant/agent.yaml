id: chat-assistant
identity: Chat-Assistent
type: specialist
default: true
soul: ./soul.md

llm:
  model: claude-sonnet-4-6
  temperature: 0.7
  max_tokens: 4096

execution_modes:
  default: safe
  safe:
    permissions:
    - memory.read
    - memory.write

heartbeat:
  interval: 60s
  timeout: 180s
  on_failure: ignore

tools:
- web_search
- read_memory
- write_memory

mcp_servers: []
allowed_agents: []
