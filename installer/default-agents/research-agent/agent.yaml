id: research-agent
identity: Recherche-Spezialist
type: specialist
default: true
soul: ./soul.md

llm:
  model: claude-sonnet-4-6
  temperature: 0.5
  max_tokens: 8192

execution_modes:
  default: safe
  safe:
    permissions:
    - memory.read
    - memory.write
    - filesystem.read
    - filesystem.write

heartbeat:
  interval: 60s
  timeout: 180s
  on_failure: ignore

tools:
- web_search
- http_request
- read_memory
- write_memory
- read_file
- write_file

mcp_servers: []
allowed_agents: []
