id: full-stack-coder
identity: Full-Stack Entwickler
type: specialist
default: true
soul: ./soul.md

llm:
  model: claude-sonnet-4-6
  temperature: 0.3
  max_tokens: 8192

execution_modes:
  default: elevated
  safe:
    permissions:
    - filesystem.read
    - memory.read
    - memory.write
  elevated:
    permissions:
    - filesystem.read
    - filesystem.write
    - shell.exec
    - memory.read
    - memory.write

heartbeat:
  interval: 60s
  timeout: 180s
  on_failure: ignore

tools:
- read_file
- write_file
- shell_exec
- git_status
- git_diff
- git_commit
- git_push
- gitea_repo_inspect
- gitea_repo_tree
- gitea_repo_file
- gitea_create_issue
- web_search
- read_memory
- write_memory

mcp_servers: []
allowed_agents: []
