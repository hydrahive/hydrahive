id: note-taker
identity: Notiz-Manager
type: specialist
default: true
soul: ./soul.md

llm:
  model: claude-sonnet-4-6
  temperature: 0.4
  max_tokens: 4096

execution_modes:
  default: safe
  safe:
    permissions:
    - memory.read
    - memory.write
    - filesystem.read
    - filesystem.write

heartbeat:
  interval: 60s
  timeout: 180s
  on_failure: ignore

tools:
- read_memory
- write_memory
- read_file
- write_file

mcp_servers: []
allowed_agents: []
