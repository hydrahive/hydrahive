id: devops-engineer
identity: DevOps Engineer
type: specialist
default: true
soul: ./soul.md

llm:
  model: claude-sonnet-4-6
  temperature: 0.3
  max_tokens: 8192

execution_modes:
  default: elevated
  safe:
    permissions:
    - filesystem.read
    - system.read
    - memory.read
    - memory.write
  elevated:
    permissions:
    - filesystem.read
    - filesystem.write
    - shell.exec
    - system.read
    - system.write
    - memory.read
    - memory.write
  root:
    permissions:
    - filesystem.read
    - filesystem.write
    - shell.exec
    - system.read
    - system.write
    - memory.read
    - memory.write

heartbeat:
  interval: 60s
  timeout: 180s
  on_failure: ignore

tools:
- shell_exec
- read_file
- write_file
- read_system_file
- write_system_file
- git_status
- git_diff
- git_commit
- git_push
- http_request
- web_search
- wks_shell_exec
- wks_file_read
- wks_file_write
- read_memory
- write_memory

mcp_servers: []
allowed_agents: []
