# HydraHive Security-Header (#603 XSS-Haertung)
#
# Include in JEDEM location-Block weil nginx add_header bei location-Block
# nicht automatisch vom server-Block erbt.
#
# Usage (nginx): include /etc/nginx/snippets/hydrahive-security-headers.conf;

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
