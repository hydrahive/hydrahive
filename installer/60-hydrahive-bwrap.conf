# HydraHive — bwrap-Sandbox fuer shell_exec (#605)
#
# Ubuntu 24.04+ hat AppArmor-Restriction fuer unprivileged user namespaces.
# Ohne diese Ausnahme kann bwrap keine UID-Map setzen → safe-Mode shell_exec
# wuerde fail-closed greifen und shell_exec verweigern.
#
# Diese Config wird von /etc/sysctl.d/ gelesen und beim Boot angewendet.
#
# Installation:
#   sudo cp installer/60-hydrahive-bwrap.conf /etc/sysctl.d/
#   sudo sysctl --system

kernel.apparmor_restrict_unprivileged_userns=0
